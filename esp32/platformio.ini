; AIFace ESP32-S3 Display Client
; PlatformIO project configuration

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.arduino.partitions = default_8MB.csv
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
  links2004/WebSockets @ ^2.4.1
  bblanchon/ArduinoJson @ ^7.0.0
  Bodmer/TFT_eSPI @ ^2.5.43
  tzapu/WiFiManager @ ^2.0.17

build_flags =
  ; Tell TFT_eSPI to skip its default User_Setup.h and use our flags
  -DUSER_SETUP_LOADED=1
  ; Display driver
  -DST7789_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=240
  ; SPI data/clock pins — Waveshare ESP32-S3-LCD-1.54
  ; Source: waveshareteam/ESP32-S3-Touch-LCD-1.54 BSP
  -DTFT_MOSI=39
  -DTFT_SCLK=38
  -DTFT_CS=21
  -DTFT_DC=45
  -DTFT_RST=40
  -DTFT_BL=46
  -DTFT_INVERSION_ON=1
  ; USE_FSPI_PORT forces SPI_PORT=2 (not FSPI=0) so REG_SPI_BASE returns the
  ; correct 0x60024000 peripheral address on ESP32-S3 (IDF requires index >=2)
  -DUSE_FSPI_PORT
  ; Load built-in GLCD font
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  ; SPI clock speed
  -DSPI_FREQUENCY=40000000
  ; Needed by WiFiManager to select the ESP32 (not ESP8266) code path
  -DESP32
  ; Route Serial to USB-CDC (not UART0) so output appears on /dev/cu.usbmodem*
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Enable PSRAM for TFT_eSprite off-screen buffer (needed for flicker-free rendering)
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
