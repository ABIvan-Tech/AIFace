; AIFace ESP32-S3 Display Client
; PlatformIO project configuration

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
  links2004/WebSockets @ ^2.4.1
  bblanchon/ArduinoJson @ ^7.0.0
  Bodmer/TFT_eSPI @ ^2.5.43
  tzapu/WiFiManager @ ^0.16.0

build_flags =
  ; Tell TFT_eSPI to skip its default User_Setup.h and use our flags
  -DUSER_SETUP_LOADED=1
  ; Display driver
  -DST7789_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=240
  ; SPI data/clock pins (adjust in config.h if your board differs)
  -DTFT_MOSI=11
  -DTFT_SCLK=12
  -DTFT_CS=10
  -DTFT_DC=8
  -DTFT_RST=9
  -DTFT_BL=46
  ; Load built-in GLCD font
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  ; SPI clock speed
  -DSPI_FREQUENCY=40000000
  ; Enable PSRAM
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
